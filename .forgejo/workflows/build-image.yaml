---
name: Docker Build

on:
  push:
    branches: [main, dev]

env:
  SEMAPHORE_PROJECT_ID: 2
  SEMAPHORE_TEMPLATE_ID: 2
  REGISTRY_SERVER: git.dotnot.pl
  IMAGE_NAME: karol.kozlowski/ltss-presenter

jobs:
  test:
    runs-on: docker
    container:
      image: python:3-alpine

    steps:
      - name: Set up dependencies
        run: |
          apk add --no-cache nodejs git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install --no-cache-dir --upgrade -r requirements-dev.txt

      - name: Run static code checks
        run: |
          black --check --diff .
          ruff check --diff .
          isort --profile black --check-only --diff .

  build:
    needs: [test]
    runs-on: docker
    container:
      image: alpine:latest

    steps:
      - name: Set up Docker CLI
        run: |
          apk add --no-cache nodejs git docker-cli curl

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_SERVER }}
          username: ${{ secrets.RELEASE_USER }}
          password: ${{ secrets.RELEASE_SECRET }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: github.ref_name == 'main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Build and push
        if: github.ref_name != 'main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY_SERVER }}/${{ env.IMAGE_NAME }}:${{ forge.ref_name }}

  deploy:
    needs: [build]
    runs-on: docker
    steps:
      - name: Deploy with Semaphore API
        run: |
          curl -X POST "${{ vars.SEMAPHORE_API_URL }}/api/project/${{ env.SEMAPHORE_PROJECT_ID }}/tasks" \
            -H "Authorization: Bearer ${{ secrets.SEMAPHORE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{ "template_id": ${{ env.SEMAPHORE_TEMPLATE_ID }} }'
