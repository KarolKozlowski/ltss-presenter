<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LTSS Presenter</title>
    <link rel="stylesheet" href="static/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <h1>LTSS Presenter</h1>
        <p>Explore Home Assistant long-term statistics.</p>
      </header>

      <section class="panel">
        <div class="field field-full">
          <label for="metric">Metric</label>
          <select id="metric"></select>
        </div>
        <div class="field">
          <label for="start">Start (ISO)</label>
          <input id="start" class="datepicker" type="text" placeholder="YYYY-MM-DD HH:MM" />
        </div>
        <div class="field">
          <label for="end">End (ISO)</label>
          <input id="end" class="datepicker" type="text" placeholder="YYYY-MM-DD HH:MM" />
        </div>
        <div class="actions">
          <button id="load">Load chart</button>
        </div>
      </section>

      <section class="panel">
        <div id="chart" class="chart"></div>
      </section>

      <footer class="footer">

      </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="static/app.js"></script>
  </body>
</html>
