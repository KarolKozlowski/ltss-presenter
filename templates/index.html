<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LTSS Presenter</title>
    <link
      rel="stylesheet"
      href="https://npmcdn.com/flatpickr/dist/themes/dark.css"
    />
    <link rel="stylesheet" href="static/theme.css" />
    <link rel="stylesheet" href="static/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <h1>LTSS Presenter</h1>
        <p>Explore Home Assistant long-term statistics.</p>
      </header>

      <section class="panel">
        <div class="field field-full">
          <label for="metric">Metric</label>
          <select id="metric"></select>
        </div>
        <div class="field">
          <label for="start">Start (ISO)</label>
          <input
            id="start"
            class="datepicker"
            type="text"
            placeholder="YYYY-MM-DD HH:MM"
          />
        </div>
        <div class="field">
          <label for="end">End (ISO)</label>
          <input
            id="end"
            class="datepicker"
            type="text"
            placeholder="YYYY-MM-DD HH:MM"
          />
        </div>
        <div class="quick-range">
          <span class="quick-range-label">Last</span>
          <button class="quick-range-btn" data-hours="3" type="button">
            3h
          </button>
          <button class="quick-range-btn" data-hours="6" type="button">
            6h
          </button>
          <button class="quick-range-btn" data-hours="12" type="button">
            12h
          </button>
          <button class="quick-range-btn" data-hours="24" type="button">
            24h
          </button>
        </div>
        <div class="actions">
          <button id="load">Load chart</button>
        </div>
      </section>

      <section class="panel">
        <div id="chart" class="chart"></div>
        <div id="metric-text" class="metric-text" aria-live="polite"></div>
      </section>

      <section class="panel">
        <details class="ltss-fold">
          <summary class="ltss-fold-summary">Additional widgets</summary>
          <section class="ltss-grid">
            <article
              class="ltss-card ltss-card--value"
              data-metric-id="outdoor_temperature"
              data-hours="24"
            >
              <header class="ltss-card-header">
                <h3 class="ltss-card-title">Temperatura</h3>
                <p class="ltss-card-subtitle">Ostatni odczyt</p>
              </header>
              <div class="ltss-chart">
                <div
                  class="ltss-chart-canvas"
                  role="img"
                  aria-label="Wykres danych"
                ></div>
                <div class="ltss-chart-text" aria-live="polite"></div>
                <div class="ltss-chart-status" aria-live="polite">
                  Loading...
                </div>
              </div>
            </article>
            <article
              class="ltss-card ltss-card--value"
              data-metric-id="outdoor_humidity"
              data-hours="24"
            >
              <header class="ltss-card-header">
                <h3 class="ltss-card-title">Wilgotnosc</h3>
              </header>
              <div class="ltss-chart">
                <div
                  class="ltss-chart-canvas"
                  role="img"
                  aria-label="Wykres danych"
                ></div>
                <div class="ltss-chart-text" aria-live="polite"></div>
                <div class="ltss-chart-status" aria-live="polite">
                  Loading...
                </div>
              </div>
            </article>
            <article
              class="ltss-card"
              data-metric-id="outdoor_temperature"
              data-hours="24"
            >
              <header class="ltss-card-header">
                <h3 class="ltss-card-title">Wykres 1</h3>
                <p class="ltss-card-subtitle">Last 24h</p>
              </header>
              <div class="ltss-chart">
                <div
                  class="ltss-chart-canvas"
                  role="img"
                  aria-label="Wykres danych"
                ></div>
                <div class="ltss-chart-text" aria-live="polite"></div>
                <div class="ltss-chart-status" aria-live="polite">
                  Loading...
                </div>
              </div>
            </article>
            <article
              class="ltss-card"
              data-metric-id="outdoor_humidity"
              data-hours="24"
            >
              <header class="ltss-card-header">
                <h3 class="ltss-card-title">Wykres 2</h3>
                <p class="ltss-card-subtitle">Last 24h</p>
              </header>
              <div class="ltss-chart">
                <div
                  class="ltss-chart-canvas"
                  role="img"
                  aria-label="Wykres danych"
                ></div>
                <div class="ltss-chart-text" aria-live="polite"></div>
                <div class="ltss-chart-status" aria-live="polite">
                  Loading...
                </div>
              </div>
            </article>
            <article
              class="ltss-card"
              data-metric-ids="outdoor_temperature,outdoor_humidity"
              data-hours="24"
            >
              <header class="ltss-card-header">
                <h3 class="ltss-card-title">Wykres 3</h3>
                <p class="ltss-card-subtitle">Last 24h</p>
              </header>
              <div class="ltss-chart">
                <div
                  class="ltss-chart-canvas"
                  role="img"
                  aria-label="Wykres danych"
                ></div>
                <div class="ltss-chart-text" aria-live="polite"></div>
                <div class="ltss-chart-status" aria-live="polite">
                  Loading...
                </div>
              </div>
            </article>

            <article
              class="ltss-card ltss-card--full ltss-card--text"
              data-metric-id="outdoor_aqi_epa_category"
              data-title="Status powietrza"
            >
              <header class="ltss-card-header">
                <h3 class="ltss-card-title">Status powietrza</h3>
                <p class="ltss-card-subtitle">Aktualny odczyt</p>
              </header>
              <div class="ltss-chart">
                <div
                  class="ltss-chart-canvas"
                  role="img"
                  aria-label="Wykres danych"
                ></div>
                <div class="ltss-chart-text" aria-live="polite"></div>
                <div class="ltss-chart-status" aria-live="polite">
                  Loading...
                </div>
              </div>
            </article>
          </section>
        </details>
      </section>

      <footer class="footer"></footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script type="module" src="static/app.js"></script>
    <script src="static/ltss-config.js"></script>
    <script type="module" src="static/ltss-widgets.js"></script>
  </body>
</html>
